# Agent en/access-to-care. Shared keys (model, retention, timeout, limits) are in the root agent.yml.
# Leaf-only keys must be in each leaf: name, mode, idle_ttl, protection, triggers, events.
name: "Access to care"
mode: turns
idle_ttl: 5m
protection: token
triggers:
  http: true
knowledge:
  - en/rendez-vous
  - en/orientation
  - en/systeme-sante
  # Same subjects in French: searched when the English sources have nothing useful.
  - fr/rendez-vous
  - fr/orientation
  - fr/systeme-sante
# Place tools of the web app (_apis/agent-sante-tools.yaml). Run egress adds the shared secret
# header; the web Worker refuses a call without it. The tools never get a postal code.
network:
  agentsante.ca:
    headers:
      x-agent-sante-tools: "${secret:TOOLS_SECRET}"
secrets:
  TOOLS_SECRET: {}
events:
  status:
    description: "Say in one short sentence what you are doing (search, read, places, handoff). Call it in the same step as that tool. Never advice, a diagnosis or a dose."
    schema:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 100
  handoff:
    description: "Hand off the conversation to another Agent Santé agent in English. Call it once, as the first action, then end the turn with no text."
    schema:
      type: object
      additionalProperties: false
      required: [to, reason]
      properties:
        to:
          type: string
          enum:
            - en/concierge
            - en/viruses-vaccines
            - en/seniors
            - en/mental-health
            - en/pregnancy-children
            - en/illness-medication
            - en/prevention-environment
            - en/sexual-health
            - en/gastro
            - en/flu
            - en/medications
        reason:
          type: string
          minLength: 1
          maxLength: 200
  switch_language:
    description: "Switch to the French version when the last message of the person is in French or when they ask for it. Do not answer in French. End the turn with no text."
    schema:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          enum: [fr]
